# macOS runner 上编译 iOS 应用 → 产出**未签名** .ipa 工件
#
# 为什么这样切：Windows 上编译不出 iOS 应用（无 Xcode/iOS SDK），
# 所以把"编译"放到 GitHub 的 macOS runner，"签名"留在本机（Sideloadly 用你的 Apple ID）。
# ⇒ **不给 CI 任何 Apple ID 凭据**（签名凭据不离开你的电脑）。
#
# 产物：DSHRemote-unsigned.ipa（Payload/DSHRemote.app 打包），本机用 Sideloadly 重签后装到 iPad。
# ⚠️ 未实测：本条流水线尚未在真仓跑过（见 README §0）。

name: ios-build

on:
  workflow_dispatch:        # 手动触发（先手动验，稳了再加 push 触发）
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 选最新的 Xcode（并打印版本，便于排查）
        # 🔴 为什么必须选：macos-14 镜像默认 Xcode 是 **15.4**，而 XcodeGen 新版产出的 .xcodeproj
        #    是 **objectVersion 77**（Xcode 16 格式）⇒ 15.4 直接读不了：
        #    「Unable to read project … future Xcode project file format (77)」（2026-09-30 实测两次踩到）。
        #    ⇒ 取镜像里版本号最高的 Xcode_*.app（新 Xcode 读旧格式没问题，反向才不行）。
        run: |
          set -euo pipefail
          echo "--- 镜像里可用的 Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          BEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$BEST" ]; then sudo xcode-select -s "$BEST"; fi
          echo "--- 选定 ---"
          xcode-select -p
          xcodebuild -version

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj（并打印工程格式取证）
        run: |
          set -euo pipefail
          xcodegen --version
          xcodegen generate
          echo "--- 生成的工程格式（期望与本机 Xcode 可读）---"
          grep -m1 'objectVersion' DSHRemote.xcodeproj/project.pbxproj

      - name: 编译（Release，不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project DSHRemote.xcodeproj \
            -scheme DSHRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60

      - name: 打成未签名 .ipa
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "app = $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DSHRemote-unsigned.ipa Payload
          ls -lh DSHRemote-unsigned.ipa
          # 自检：包内必须有可执行文件（否则装上去是白图标）
          unzip -l DSHRemote-unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: DSHRemote-unsigned-ipa
          path: DSHRemote-unsigned.ipa
          if-no-files-found: error
