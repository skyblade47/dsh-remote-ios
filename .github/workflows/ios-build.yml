# macOS runner 上编译 iOS 应用 → 产出**未签名** .ipa 工件
#
# 为什么这样切：Windows 上编译不出 iOS 应用（无 Xcode/iOS SDK），
# 所以把"编译"放到 GitHub 的 macOS runner，"签名"留在本机（Sideloadly 用你的 Apple ID）。
# ⇒ **不给 CI 任何 Apple ID 凭据**（签名凭据不离开你的电脑）。
#
# 产物：DSHRemote-unsigned.ipa（Payload/DSHRemote.app 打包），本机用 Sideloadly 重签后装到 iPad。
# ⚠️ 未实测：本条流水线尚未在真仓跑过（见 README §0）。

name: ios-build

on:
  workflow_dispatch:        # 手动触发（先手动验，稳了再加 push 触发）
  push:
    tags:
      - 'v*'
    branches:
      - 'feature/embedded-tsnet'   # 方案 D 闸门 A：分支推送即验证 TailscaleKit 可构建
  pull_request:
    branches:
      - main

jobs:
  # 方案 D 闸门 A：回答「官方 TailscaleKit.xcframework 能否在当日工具链可复现构建、
  # 切片是否齐全、能否压到 iOS 17.0」。产物 artifact 供 build job 下载链接
  # （链接原为 Phase 3.1 的活，因 Phase 2.1 侧载可行性验证需要真包而提前为 spike 链接）。
  tailscalekit-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode 16.1+（并打印版本）
        run: |
          set -euo pipefail
          echo "--- 镜像里可用的 Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          BEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$BEST" ]; then sudo xcode-select -s "$BEST"; fi
          echo "--- 选定 ---"
          xcode-select -p
          xcodebuild -version

      - name: 装 Go（版本以 Vendor/TAILSCALEKIT.VERSION 的 go.mod 要求为准）
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          # libtailscale 由构建脚本在运行时克隆到 .tailscalekit-src（gitignore），
          # checkout 阶段没有 go.sum，不能用 setup-go 内置依赖缓存
          cache: false

      - name: 构建 TailscaleKit.xcframework（ios-fat，钉 commit）
        # 显式 bash：脚本从 Windows 侧提交，不保证带可执行位
        run: bash tools/build-tailscalekit.sh --force

      - name: 闸门 A 切片验收（device arm64 + simulator arm64/x86_64）
        run: |
          set -euo pipefail
          FW=Vendor/TailscaleKit.xcframework
          test -d "$FW"
          echo "--- Info.plist 可用库 ---"
          /usr/libexec/PlistBuddy -c 'Print AvailableLibraries' "$FW/Info.plist" || true
          DEV_BIN="$FW/ios-arm64/TailscaleKit.framework/TailscaleKit"
          SIM_BIN="$FW/ios-arm64_x86_64-simulator/TailscaleKit.framework/TailscaleKit"
          # 切片目录名若随上游变动，退回按标识符定位
          if [ ! -f "$DEV_BIN" ]; then DEV_BIN="$(find "$FW" -path '*iphoneos*/*/TailscaleKit' -o -path '*ios-arm64/*/TailscaleKit' | head -1)"; fi
          if [ ! -f "$SIM_BIN" ]; then SIM_BIN="$(find "$FW" -path '*simulator*/*/TailscaleKit' -o -path '*ios-*simulator/*/TailscaleKit' | head -1)"; fi
          echo "dev bin = $DEV_BIN"; echo "sim bin = $SIM_BIN"
          test -f "$DEV_BIN"; test -f "$SIM_BIN"
          echo "--- device 切片（期望 arm64）---"; lipo -archs "$DEV_BIN"
          echo "--- simulator 切片（期望 arm64 x86_64）---"; lipo -archs "$SIM_BIN"
          lipo -archs "$DEV_BIN" | grep -qw arm64
          lipo -archs "$SIM_BIN" | grep -qw arm64
          lipo -archs "$SIM_BIN" | grep -qw x86_64
          echo "SLICE_CHECK=PASS"

      - name: 闸门 A iOS 17.0 覆盖探测（上游 pbxproj 写死 18.1）
        # 不改上游源码，仅用命令行覆盖部署目标重新 archive 一次 framework，
        # 验证 Swift 层没有 iOS 18 only API 硬依赖。失败只告警、不阻断（留证评审），
        # 因为真正的链接验证在 Phase 3.1；但这一步的输出是 17.0 决策的关键证据。
        run: |
          set -euo pipefail
          SRC=.tailscalekit-src
          # libtailscale_ios.a 已由上一步 tools/build-tailscalekit.sh（make ios-fat）产出。
          # 注意：xcodeproj 在 swift/ 子目录，上游 swift/Makefile 也是 cd swift 后再
          # xcodebuild -derivedDataPath build；这里必须在同一目录，否则 rc=66
          # 「directory does not contain an Xcode project」。用独立 derivedData 不污染正式产物。
          set +e
          ( cd "$SRC/swift" && xcodebuild build \
              -scheme "TailscaleKit (iOS)" \
              -derivedDataPath build-ios17 \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              IPHONEOS_DEPLOYMENT_TARGET=17.0 \
              CODE_SIGNING_ALLOWED=NO ) > /tmp/ios17-build.log 2>&1
          RC=$?
          set -e
          echo "xcodebuild rc=$RC"
          if [ $RC -eq 0 ]; then
            echo "IOS17_OVERRIDE=PASS（命令行覆盖到 17.0 可构建）"
          else
            echo "IOS17_OVERRIDE=FAIL（以下为错误上下文，需评审是否 pin 旧 commit / 另做包装）"
            grep -nE 'error:|has been renamed|requires iOS|was deprecated|is only available' /tmp/ios17-build.log | head -40 || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TailscaleKit-xcframework
          path: Vendor/TailscaleKit.xcframework
          if-no-files-found: error

  build:
    needs: tailscalekit-gate
    # macos-15（与 gate 同镜像）：TailscaleKit 的 swiftinterface 由 Xcode 26 / Swift 6.2.4
    # 产出，macos-14 自带的 Xcode 16/Swift 6.1 消费不了（module 兼容性报错）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 下载 TailscaleKit.xcframework（复用 gate 产物，不重复跑 Go 构建）
        # Phase 2.1 spike：app target 已依赖 Vendor/TailscaleKit.xcframework（gitignored），
        # 必须在 xcodegen generate 之前就位，否则工程生成会因找不到 framework 失败。
        # 注意：upload-artifact 上传目录时，artifact 根就是该目录的*内容*（Info.plist 直接
        # 在根，无外层包装，本地 gh run download 可证），所以这里要显式落到包装目录名里。
        uses: actions/download-artifact@v4
        with:
          name: TailscaleKit-xcframework
          path: Vendor/TailscaleKit.xcframework

      - name: 验收 xcframework 已就位（device + simulator 两个切片）
        run: |
          set -euo pipefail
          test -f Vendor/TailscaleKit.xcframework/ios-arm64/TailscaleKit.framework/TailscaleKit
          test -f Vendor/TailscaleKit.xcframework/ios-arm64_x86_64-simulator/TailscaleKit.framework/TailscaleKit
          echo "--- device 切片体积（期望 ~20MB+，含 Go archive）---"
          ls -lh Vendor/TailscaleKit.xcframework/ios-arm64/TailscaleKit.framework/TailscaleKit

      - name: 选最新的 Xcode（并打印版本，便于排查）
        # 🔴 为什么必须选：旧镜像默认 Xcode 是 **15.4**，而 XcodeGen 新版产出的 .xcodeproj
        #    是 **objectVersion 77**（Xcode 16 格式）⇒ 15.4 直接读不了：
        #    「Unable to read project … future Xcode project file format (77)」（2026-09-30 实测两次踩到）。
        #    ⇒ 取镜像里版本号最高的 Xcode_*.app（新 Xcode 读旧格式没问题，反向才不行）。
        run: |
          set -euo pipefail
          echo "--- 镜像里可用的 Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          BEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$BEST" ]; then sudo xcode-select -s "$BEST"; fi
          echo "--- 选定 ---"
          xcode-select -p
          xcodebuild -version

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj（并打印工程格式取证）
        run: |
          set -euo pipefail
          xcodegen --version
          xcodegen generate
          echo "--- 生成的工程格式（期望与本机 Xcode 可读）---"
          grep -m1 'objectVersion' DSHRemote.xcodeproj/project.pbxproj

      - name: 运行模拟器逻辑测试
        run: |
          set -euo pipefail
          DEST_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; rs=sorted(k for k in d if k.startswith("com.apple.CoreSimulator.SimRuntime.iOS-")); print(next((x["udid"] for rt in reversed(rs) for x in d[rt] if x.get("isAvailable") and x["name"].startswith("iPad")), ""))')
          echo "destination udid = ${DEST_ID}"
          test -n "${DEST_ID}"
          xcodebuild test \
            -project DSHRemote.xcodeproj \
            -scheme DSHRemote \
            -destination "platform=iOS Simulator,id=${DEST_ID}" \
            CODE_SIGNING_ALLOWED=NO

      - name: 编译（Release，不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project DSHRemote.xcodeproj \
            -scheme DSHRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60

      - name: Phase 2.1 spike 自检（TailscaleKit 动态 framework 确实 embed 进包）
        # 🔴 magic bytes 取证：TailscaleKit.framework/TailscaleKit 是 MH_DYLIB（动态框架），
        #    21MB Go 在 dylib 内，主二进制仍 ~1MB、只含 LC_LOAD_DYLIB（run 40167137252 实证）。
        #    所以自检口径不是「主二进制 >20MB」，而是：
        #      1) .app/Frameworks/TailscaleKit.framework/TailscaleKit 存在且 ≥20MB（embed 成功）
        #      2) otool -L 主二进制含 TailscaleKit 的 LC_LOAD_DYLIB（链接成功）
        #      3) dylib 自身导出 tailscale_* C 接口（Go c-archive 确在其中）
        #    任一不满足就让 CI 红——否则产出的 ipa 无法代表「含 Go dylib 的包」，侧载结论无效。
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DSHRemote.app"
          BIN="$APP/DSHRemote"
          FW="$APP/Frameworks/TailscaleKit.framework/TailscaleKit"
          test -f "$BIN"
          echo "--- 主二进制体积（动态链接，预期仍 ~1MB）---"
          ls -lh "$BIN"
          echo "--- .app/Frameworks 内容（期望 TailscaleKit.framework）---"
          ls -lhR "$APP/Frameworks" || { echo "::error::.app/Frameworks 不存在，embed 未生效"; exit 1; }
          test -f "$FW"
          SIZE=$(stat -f%z "$FW")
          echo "embedded dylib size bytes = $SIZE"
          if [ "$SIZE" -lt 20000000 ]; then
            echo "::error::embed 的 TailscaleKit $SIZE 字节 < 20MB，Go dylib 疑似不对，spike 包无效"
            exit 1
          fi
          echo "--- 主二进制 LC_LOAD_DYLIB（必须引用 @rpath/TailscaleKit）---"
          otool -L "$BIN" | grep -i TailscaleKit
          otool -L "$BIN" | grep -qi TailscaleKit
          echo "--- dylib 导出 tailscale_*（至少 tailscale_dial / tailscale_new）---"
          nm -gU "$FW" | grep -E ' _tailscale_(dial|new|listen|up|close)$' | head -20
          nm -gU "$FW" | grep -q ' _tailscale_dial$'
          nm -gU "$FW" | grep -q ' _tailscale_new$'
          echo "SPIKE_LINK_CHECK=PASS"

      - name: 打成未签名 .ipa
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "app = $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DSHRemote-unsigned.ipa Payload
          ls -lh DSHRemote-unsigned.ipa
          # 自检：包内必须有可执行文件（否则装上去是白图标）
          unzip -l DSHRemote-unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: DSHRemote-unsigned-ipa
          path: DSHRemote-unsigned.ipa
          if-no-files-found: error
