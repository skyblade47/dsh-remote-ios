# XcodeGen 工程描述（CI 的 macOS runner 上用 `xcodegen generate` 生成 .xcodeproj）
# 为什么用 XcodeGen：.xcodeproj 是二进制/难 review 的产物；用一份可读的 yml 描述工程，
# 变更在 git 里看得见（与"配置即代码"同一取向）。
name: DSHRemote
options:
  bundleIdPrefix: com.skyblade47
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 🔴 2026-09-30 实测结论：**本版 XcodeGen（2.46.0）钉不住工程格式** ——
  #    `objectVersion: 56`（数字）与 `"56"`（字符串）两种写法生成出来**都是 77**（CI 里 grep 取证过）。
  #    ⇒ 所以这里**不再写这个键**（写了也是死配置，会让人误以为在起作用）；
  #    改为在 CI 侧兜住：`ios-build.yml` 会**选镜像里版本号最高的 Xcode**（新 Xcode 读旧格式没问题）。
  #    本地若用 Xcode 15 打开本项目，需要自己把 Xcode 升到 16+（或让 XcodeGen 换更老的版本）。

targets:
  DSHRemote:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ShellAssets
        buildPhase: resources
        type: group
        group: ""
    info:
      path: Resources/Info.plist
    # 正式链接 TailscaleKit.xcframework（Phase 2.1 已提前验证「免费 Apple ID 能侧载
    # 含 ~22MB Go dylib 的包」，Phase 3.1 转正）。framework 是 gitignored 的 CI 产物，
    # CI build job 从 tailscalekit-gate 的 artifact 下载到 Vendor/ 后才 xcodegen。
    #
    # 🔴 2026-10-25 magic bytes 取证（ios-arm64/TailscaleKit.framework/TailscaleKit）：
    #    CF FA ED FE = Mach-O 64 thin arm64，offset 12 filetype=06 = **MH_DYLIB**。
    #    即 TailscaleKit 是**动态 framework**（21MB Go 在 dylib 内，不在主二进制里）。
    #    -force_load 对 dylib 不并入代码（run 40167137252 实测主二进制仅 1.0MB），
    #    正确做法是 Embed & Sign：拷贝到 .app/Frameworks/，主二进制只留 LC_LOAD_DYLIB。
    #    未签名 CI 包里 embed 阶段只拷贝；签名交给本机 Sideloadly（须覆盖 Frameworks 内全部二进制）。
    dependencies:
      - framework: Vendor/TailscaleKit.xcframework
        embed: true                       # 动态 framework：Embed Frameworks 拷进 .app/Frameworks/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyblade47.dshremote
        MARKETING_VERSION: "0.2.5"        # 与 dsh-remote / writing-client 保持同一版本节奏
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "2"       # 2 = iPad only（本仓只面向 iPad）
        CODE_SIGNING_ALLOWED: "NO"        # CI 里产出**未签名**包，签名留给本机 Sideloadly
        ENABLE_BITCODE: "NO"
  DSHRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/DSHRemoteTests
      # 🔴 2026-10-11 实测：test target 用独立 `resources:` 段（type: group / group: ""）
      #    在 XcodeGen 2.46 下**不产出** Copy Bundle Resources（第十次 CI 日志零 CpResource 取证），
      #    DSHRemoteTests.xctest 内无 shell.html，ShellNavigationTests 的 Bundle(for:).url 为 nil。
      #    ⇒ 复刻 app target 已验证有效的写法：放进 `sources:` 并显式 buildPhase: resources。
      - path: ShellAssets
        buildPhase: resources
        type: group
        group: ""
    dependencies:
      - target: DSHRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyblade47.dshremote.tests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGNING_ALLOWED: "NO"
