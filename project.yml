# XcodeGen 工程描述（CI 的 macOS runner 上用 `xcodegen generate` 生成 .xcodeproj）
# 为什么用 XcodeGen：.xcodeproj 是二进制/难 review 的产物；用一份可读的 yml 描述工程，
# 变更在 git 里看得见（与"配置即代码"同一取向）。
name: DSHRemote
options:
  bundleIdPrefix: com.skyblade47
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 🔴 2026-09-30 实测结论：**本版 XcodeGen（2.46.0）钉不住工程格式** ——
  #    `objectVersion: 56`（数字）与 `"56"`（字符串）两种写法生成出来**都是 77**（CI 里 grep 取证过）。
  #    ⇒ 所以这里**不再写这个键**（写了也是死配置，会让人误以为在起作用）；
  #    改为在 CI 侧兜住：`ios-build.yml` 会**选镜像里版本号最高的 Xcode**（新 Xcode 读旧格式没问题）。
  #    本地若用 Xcode 15 打开本项目，需要自己把 Xcode 升到 16+（或让 XcodeGen 换更老的版本）。

targets:
  DSHRemote:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ShellAssets
        buildPhase: resources
        type: group
        group: ""
    info:
      path: Resources/Info.plist
    # Phase 2.1 spike：正式把 TailscaleKit.xcframework 链进 app（原定 Phase 3.1，为验证
    # 「免费 Apple ID 能否侧载含 ~21MB Go c-archive 的包」而提前）。framework 是 gitignored 的
    # CI 产物，CI build job 从 tailscalekit-gate 的 artifact 下载到 Vendor/ 后才 xcodegen。
    dependencies:
      - framework: Vendor/TailscaleKit.xcframework
        embed: false                      # 静态 framework：链接进主二进制，不做 Embed Frameworks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyblade47.dshremote
        MARKETING_VERSION: "0.2.5"        # 与 dsh-remote / writing-client 保持同一版本节奏
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "2"       # 2 = iPad only（本仓只面向 iPad）
        CODE_SIGNING_ALLOWED: "NO"        # CI 里产出**未签名**包，签名留给本机 Sideloadly
        ENABLE_BITCODE: "NO"
        # TailscaleKit 是单个含完整 Go archive 的静态 fat binary；普通链接只拉被引用的
        # .o，cgo/Go 运行时符号会被裁掉（即便 Swift 侧引用了 API，跨语言引用链也不完整）。
        # ⇒ 按 sdk 分切片 -force_load 整个归档（device/simulator 路径不同，不能用同一条）。
        "OTHER_LDFLAGS[sdk=iphoneos*]": "-force_load $(SRCROOT)/Vendor/TailscaleKit.xcframework/ios-arm64/TailscaleKit.framework/TailscaleKit"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "-force_load $(SRCROOT)/Vendor/TailscaleKit.xcframework/ios-arm64_x86_64-simulator/TailscaleKit.framework/TailscaleKit"
  DSHRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/DSHRemoteTests
      # 🔴 2026-10-11 实测：test target 用独立 `resources:` 段（type: group / group: ""）
      #    在 XcodeGen 2.46 下**不产出** Copy Bundle Resources（第十次 CI 日志零 CpResource 取证），
      #    DSHRemoteTests.xctest 内无 shell.html，ShellNavigationTests 的 Bundle(for:).url 为 nil。
      #    ⇒ 复刻 app target 已验证有效的写法：放进 `sources:` 并显式 buildPhase: resources。
      - path: ShellAssets
        buildPhase: resources
        type: group
        group: ""
    dependencies:
      - target: DSHRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyblade47.dshremote.tests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGNING_ALLOWED: "NO"
