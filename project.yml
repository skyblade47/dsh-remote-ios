# XcodeGen 工程描述（CI 的 macOS runner 上用 `xcodegen generate` 生成 .xcodeproj）
# 为什么用 XcodeGen：.xcodeproj 是二进制/难 review 的产物；用一份可读的 yml 描述工程，
# 变更在 git 里看得见（与"配置即代码"同一取向）。
name: DSHRemote
options:
  bundleIdPrefix: com.skyblade47
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # ⚠️ 取证中：2026-09-30 先按数字 `56` 试过一次，CI 里生成的仍是 **77**（说明本版 XcodeGen
  #    可能不认这个键、或只认字符串）⇒ 这里改字符串再验一次，并在 CI 里 `grep objectVersion` 打印。
  #    两条腿并行：即使本选项最终无效，CI 也已经改成"选镜像里最新的 Xcode"来兜住（见 ios-build.yml）。
  objectVersion: "56"

targets:
  DSHRemote:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyblade47.dshremote
        MARKETING_VERSION: "0.1.0"        # 与 dsh-remote / writing-client 保持同一版本节奏，不擅升
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "2"       # 2 = iPad only（本仓只面向 iPad）
        CODE_SIGNING_ALLOWED: "NO"        # CI 里产出**未签名**包，签名留给本机 Sideloadly
        ENABLE_BITCODE: "NO"
